[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-tps-statusline"
version = "0.2.0"
description = "Cross-platform, low-overhead tok/s, context, and quota status line for Antigravity CLI (agy)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["antigravity", "agy", "cli", "statusline", "tps", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
agy-tps-statusline = "agy_tps_statusline.cli:main"

[tool.setuptools.packages.find]
include = ["agy_tps_statusline*"]
